<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14161a" id="themeColor">
<title>画师收藏夹</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('artist-collection-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  }catch(e){}
})();
</script>
<style>
*{box-sizing:border-box}

/* ===== 深色主题（默认） ===== */
:root{
  --bg:#14161a; --panel:#1b1e25; --panel2:#23272f; --border:#2c313c;
  --text:#e7e9ee; --muted:#8b93a7; --accent:#7c9cff; --danger:#ff6b6b;
  --header-bg:rgba(20,22,26,.88);
  --cover-bg:#0f1115;
  --ph-text:#39404f;
  --card-hover-border:#3d4557;
  --shadow:0 10px 26px rgba(0,0,0,.4);
  --overlay:rgba(0,0,0,.66);
  --chip-on-bg:rgba(124,156,255,.16);
  --chip-on-border:rgba(124,156,255,.5);
  --chip-on-text:#b9c8ff;
  --primary-text:#0d1016;
  --danger-border:rgba(255,107,107,.35);
}

/* ===== 浅色主题 ===== */
html[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceef2; --border:#d7dbe2;
  --text:#1c2029; --muted:#68707f; --accent:#3a6ff0; --danger:#e5484d;
  --header-bg:rgba(255,255,255,.9);
  --cover-bg:#e8eaef;
  --ph-text:#9aa1ae;
  --card-hover-border:#b9c0cc;
  --shadow:0 10px 26px rgba(20,26,40,.12);
  --overlay:rgba(20,24,32,.45);
  --chip-on-bg:rgba(58,111,240,.12);
  --chip-on-border:rgba(58,111,240,.45);
  --chip-on-text:#2a56c8;
  --primary-text:#ffffff;
  --danger-border:rgba(229,72,77,.4);
}

html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
  -webkit-tap-highlight-color:transparent;
}
input,textarea,button{font:inherit;color:inherit}
.field{
  width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:8px 11px;outline:none;transition:.15s;
}
.field:focus{border-color:var(--accent)}
button{
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:8px 13px;cursor:pointer;transition:.15s;white-space:nowrap;
}
button:hover{border-color:var(--accent);color:var(--text)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--primary-text);font-weight:600}
button.primary:hover{filter:brightness(1.08);color:var(--primary-text)}
button.danger{color:var(--danger);border-color:var(--danger-border)}
button.danger:hover{border-color:var(--danger)}

/* 顶栏 */
header{
  position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--header-bg);backdrop-filter:blur(10px);
  padding-top:calc(12px + env(safe-area-inset-top));
}
.brand{font-weight:700;font-size:16px;white-space:nowrap;margin-right:4px}
.brand span{color:var(--accent)}
#search{flex:1;min-width:130px;width:auto}

/* 标签栏 */
#tagBar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
#tagBar:empty{display:none}
.chip{
  border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  transition:.15s;
}
.chip:hover{color:var(--text)}
.chip.on{background:var(--chip-on-bg);border-color:var(--chip-on-border);color:var(--chip-on-text)}
.chip .cnt{opacity:.6;font-size:11px}

/* 网格 */
#grid{
  display:grid;gap:16px;padding:16px;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-2px);border-color:var(--card-hover-border);box-shadow:var(--shadow)}
.cover{position:relative;aspect-ratio:1/1;background:var(--cover-bg);overflow:hidden;touch-action:pan-y}
.cover img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.cover img.broken{opacity:.22}
.cover .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ph-text);font-size:13px}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:30px;height:30px;padding:0;border-radius:50%;font-size:17px;line-height:1;
  display:grid;place-items:center;color:#fff;
  background:rgba(10,12,16,.62);border:1px solid rgba(255,255,255,.16);
  opacity:0;transition:.15s;
}
.card:hover .nav{opacity:1}
.nav.prev{left:8px}
.nav.next{right:8px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:5px;justify-content:center;pointer-events:none}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 0 2px rgba(0,0,0,.45)}
.dots span.on{background:#fff}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px}
.card h3{margin:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags .chip{padding:2px 8px;font-size:11.5px}
.note{
  margin:0;font-size:12.5px;color:var(--muted);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* 空状态 */
#empty{display:none;padding:70px 20px;text-align:center;color:var(--muted)}

/* 弹窗 */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:60;display:none;padding:24px 16px;overflow-y:auto}
.modal.open{display:block}
.modal-box{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:min(720px,100%);margin:0 auto;padding:20px 22px 18px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-head h2{margin:0;font-size:17px}
.icon{width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:12px}
.lbl{display:block;margin:14px 0 6px;font-size:12.5px;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .field{flex:1;min-width:150px;width:auto}
.img-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--cover-bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.broken{opacity:.22}
.thumb .del{
  position:absolute;top:3px;right:3px;width:20px;height:20px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.7);border:none;font-size:10px;line-height:1;display:grid;place-items:center;color:#fff;
}
.thumb .del:hover{background:var(--danger);color:#fff}
.modal-foot{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}

/* ===================== 触摸设备 ===================== */
@media (hover: none){
  .nav{opacity:1}
  .card:hover{transform:none;box-shadow:none}
}

/* ===================== 手机 / 窄屏 ===================== */
@media (max-width: 640px){
  header{padding:8px 10px;gap:6px;padding-top:calc(8px + env(safe-area-inset-top))}
  .brand{flex:1 1 auto;font-size:15px;margin-right:0}
  .btn-label{display:none}              /* 按钮只留图标 */
  header button{padding:7px 10px;font-size:15px;line-height:1}
  #search{order:9;flex:1 1 100%;min-width:0;width:100%;font-size:16px}

  #tagBar{padding:9px 10px;gap:6px}
  .chip{padding:4px 10px;font-size:12px}

  #grid{padding:10px;gap:10px;grid-template-columns:repeat(2,1fr)}
  .card .body{padding:8px 9px 10px;gap:6px}
  .card h3{font-size:13.5px}
  .note{font-size:12px;-webkit-line-clamp:2}
  .tags .chip{font-size:11px;padding:2px 7px}
  .nav{width:28px;height:28px;font-size:16px}

  /* 弹窗全屏 */
  .modal{padding:0}
  .modal-box{
    width:100%;min-height:100vh;border-radius:0;border:none;margin:0;
    padding:16px 16px calc(28px + env(safe-area-inset-bottom));
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  .field{font-size:16px}                /* 防 iOS 聚焦缩放 */
  textarea.field{font-size:16px}
  .modal-foot button{flex:1 1 auto;padding:11px 14px}
}
</style>
</head>
<body>

<header>
  <div class="brand">🎨 画师<span>收藏</span></div>
  <input id="search" class="field" placeholder="搜索名字 / 备注 / 标签…">
  <button id="addBtn" class="primary" title="添加画师">➕<span class="btn-label"> 添加画师</span></button>
  <button id="themeBtn" title="切换深浅色">🌙<span class="btn-label"> 深色</span></button>
  <button id="exportBtn" title="导出备份（含图片）">⬇️<span class="btn-label"> 导出备份</span></button>
  <button id="importBtn" title="导入备份">⬆️<span class="btn-label"> 导入</span></button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>

<div id="tagBar"></div>
<main id="grid"></main>
<div id="empty"></div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
/* ===================== 工具 ===================== */
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===================== 主题 ===================== */
const THEME_KEY = 'artist-collection-theme';
const currentTheme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.documentElement.style.colorScheme = t;
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const btn = $('#themeBtn');
  if (btn) btn.innerHTML = t === 'light'
    ? '☀️<span class="btn-label"> 浅色</span>'
    : '🌙<span class="btn-label"> 深色</span>';
  const tc = document.getElementById('themeColor');
  if (tc) tc.content = t === 'light' ? '#ffffff' : '#14161a';
}
$('#themeBtn').onclick = () => applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
applyTheme(currentTheme());

/* ===================== IndexedDB ===================== */
const DB_NAME = 'artist-collection', STORE = 'artists';
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
const os = (mode = 'readonly') => db.transaction(STORE, mode).objectStore(STORE);
const dbAll = () => new Promise((res, rej) => {
  const r = os().getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const dbPut = v => new Promise((res, rej) => {
  const r = os('readwrite').put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error);
});
const dbDel = id => new Promise((res, rej) => {
  const r = os('readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error);
});

/* ===================== 状态 ===================== */
let artists = [];
let query = '';
let filterTag = null;
let editing = null;
const idxMap = new Map();
const urlCache = new Map();

/* ===================== 图片 ===================== */
function imgSrc(img){
  if (!img) return '';
  if (img.kind === 'url') return img.src;
  let u = urlCache.get(img.id);
  if (!u) { u = URL.createObjectURL(img.blob); urlCache.set(img.id, u); }
  return u;
}

async function compressImage(file){
  try{
    if (file.size <= 700 * 1024) return file;
    const bmp = await createImageBitmap(file);
    const max = 2000;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    let out = await new Promise(r => cv.toBlob(r, 'image/webp', 0.85));
    if (!out) out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    return (out && out.size < file.size) ? out : file;
  } catch(e){ return file; }
}

/* ===================== 渲染 ===================== */
function match(a){
  if (filterTag && !a.tags.includes(filterTag)) return false;
  if (query){
    const q = query.toLowerCase();
    const hay = (a.name + ' ' + a.note + ' ' + a.tags.join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHTML(a){
  const n = a.images.length;
  let i = idxMap.get(a.id) || 0;
  if (i >= n) i = 0;
  idxMap.set(a.id, i);
  const img = a.images[i];

  const cover = img
    ? `<img src="${imgSrc(img)}" loading="lazy" onerror="this.classList.add('broken')">`
    : `<div class="ph">暂无例图</div>`;

  const nav = n > 1
    ? `<button class="nav prev" data-act="prev" title="上一张">‹</button>
       <button class="nav next" data-act="next" title="下一张">›</button>
       <div class="dots">${a.images.map((_, k) =>
         `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>`
    : '';

  return `<article class="card" data-id="${a.id}">
    <div class="cover">${cover}${nav}</div>
    <div class="body">
      <h3>${esc(a.name || '未命名')}</h3>
      ${a.tags.length ? `<div class="tags">${a.tags.map(t =>
        `<span class="chip" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : ''}
      ${a.note ? `<p class="note">${esc(a.note)}</p>` : ''}
    </div>
  </article>`;
}

function renderTagBar(){
  const counts = new Map();
  artists.forEach(a => a.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  if (filterTag && !counts.has(filterTag)) filterTag = null;

  const bar = $('#tagBar');
  if (!counts.size){ bar.innerHTML = ''; return; }

  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  bar.innerHTML =
    `<button class="chip ${filterTag ? '' : 'on'}" data-tag="">全部 <span class="cnt">${artists.length}</span></button>` +
    sorted.map(([t, c]) =>
      `<button class="chip ${filterTag === t ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)} <span class="cnt">${c}</span></button>`
    ).join('');
}

function render(){
  renderTagBar();
  const grid = $('#grid'), empty = $('#empty');
  const list = artists.filter(match).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  grid.innerHTML = list.map(cardHTML).join('');

  if (list.length){
    empty.style.display = 'none';
  } else {
    empty.style.display = 'block';
    empty.textContent = artists.length
      ? '没有符合条件的画师'
      : '还没有收藏画师，点右上角「+」开始吧';
  }
}

function updateCardImage(id){
  const a = artists.find(x => x.id === id);
  if (!a) return;
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;

  const i = idxMap.get(id) || 0;
  const cover = card.querySelector('.cover');
  const img = a.images[i];
  let el = cover.querySelector('img');

  if (img){
    if (!el){
      el = document.createElement('img');
      el.loading = 'lazy';
      el.onerror = () => el.classList.add('broken');
      cover.prepend(el);
    }
    el.src = imgSrc(img);
    el.classList.remove('broken');
  } else if (el){
    el.remove();
  }

  cover.querySelectorAll('.dots span').forEach((d, k) => d.classList.toggle('on', k === i));
}

/* ===================== 卡片交互 ===================== */
let lastSwipe = 0;

$('#grid').addEventListener('click', e => {
  if (Date.now() - lastSwipe < 400) return;   // 刚滑动过，忽略这次点击
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;

  const tagEl = e.target.closest('[data-tag]');
  if (tagEl){
    filterTag = tagEl.dataset.tag;
    render();
    return;
  }

  const act = e.target.dataset.act;
  if (act === 'prev' || act === 'next'){
    const a = artists.find(x => x.id === id);
    if (!a || a.images.length < 2) return;
    const n = a.images.length;
    const cur = idxMap.get(id) || 0;
    idxMap.set(id, (cur + (act === 'next' ? 1 : -1) + n) % n);
    updateCardImage(id);
    return;
  }

  const a = artists.find(x => x.id === id);
  if (a) openEditor(a);
});

/* 手机左右滑动切换例图 */
let tx = 0, ty = 0;
$('#grid').addEventListener('touchstart', e => {
  const card = e.target.closest('.card');
  if (!card || e.touches.length !== 1){ tx = ty = 0; return; }
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });

$('#grid').addEventListener('touchend', e => {
  if (!tx) return;
  const card = e.target.closest('.card');
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  tx = ty = 0;
  if (!card) return;
  if (e.target.closest('button')) return;            // 点在按钮上，不当作滑动
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;

  const id = card.dataset.id;
  const a = artists.find(x => x.id === id);
  if (!a || a.images.length < 2) return;

  const n = a.images.length;
  const cur = idxMap.get(id) || 0;
  idxMap.set(id, (cur + (dx < 0 ? 1 : -1) + n) % n);
  updateCardImage(id);
  lastSwipe = Date.now();
}, { passive: true });

$('#tagBar').addEventListener('click', e => {
  const chip = e.target.closest('[data-tag]');
  if (!chip) return;
  filterTag = chip.dataset.tag || null;
  render();
});

/* ===================== 编辑弹窗 ===================== */
function openEditor(a){
  editing = a
    ? { id: a.id, name: a.name, note: a.note, tags: [...a.tags],
        images: [...a.images], createdAt: a.createdAt }
    : { id: uid(), name: '', note: '', tags: [], images: [], createdAt: Date.now() };

  const isNew = !artists.some(x => x.id === editing.id);

  $('#modalBox').innerHTML = `
    <div class="modal-head">
      <h2>${isNew ? '添加画师' : '编辑画师'}</h2>
      <button class="icon" data-act="close" title="关闭">✕</button>
    </div>

    <label class="lbl">名字</label>
    <input class="field" id="f-name" value="${esc(editing.name)}" placeholder="画师名字 / 笔名">

    <label class="lbl">标签 <span class="hint">用逗号或空格分隔</span></label>
    <input class="field" id="f-tags" value="${esc(editing.tags.join(', '))}" placeholder="厚涂, 赛璐璐, pixiv">

    <label class="lbl">备注</label>
    <textarea class="field" id="f-note" rows="3" placeholder="主页链接、风格说明、约稿信息…">${esc(editing.note)}</textarea>

    <label class="lbl">例图 <span class="hint">可添加多张，卡片上滑动或左右切换</span></label>
    <div class="img-edit" id="imgList"></div>
    <div class="row" style="margin-top:10px">
      <input class="field" id="f-url" placeholder="粘贴图片链接后按回车">
      <button data-act="addUrl">添加链接</button>
      <button data-act="pickFile">上传 / 拍照</button>
      <input type="file" id="f-file" accept="image/*" multiple hidden>
    </div>

    <div class="modal-foot">
      ${isNew ? '' : '<button class="danger" data-act="delete">删除画师</button>'}
      <span style="flex:1"></span>
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="save">保存</button>
    </div>
  `;

  renderImgList();
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const el = $('#f-name'); if (el && innerWidth > 640) el.focus(); }, 60);
}

function renderImgList(){
  const box = $('#imgList');
  if (!editing.images.length){
    box.innerHTML = '<div class="hint">还没有例图</div>';
    return;
  }
  box.innerHTML = editing.images.map((img, i) => `
    <div class="thumb">
      <img src="${imgSrc(img)}" onerror="this.classList.add('broken')">
      <button class="del" data-act="rmImg" data-i="${i}" title="移除">✕</button>
    </div>`).join('');
}

function addUrlImage(){
  const inp = $('#f-url');
  const v = inp.value.trim();
  if (!v) return;
  editing.images.push({ id: uid(), kind: 'url', src: v });
  inp.value = '';
  renderImgList();
}

async function addFiles(files){
  const arr = [...files].filter(f => f.type.startsWith('image/'));
  for (const f of arr){
    const blob = await compressImage(f);
    editing.images.push({ id: uid(), kind: 'file', blob, name: f.name || '' });
  }
  renderImgList();
}

async function saveEditor(){
  editing.name = $('#f-name').value.trim();
  editing.note = $('#f-note').value.trim();
  editing.tags = $('#f-tags').value
    .split(/[,，\s]+/)
    .map(s => s.trim())
    .filter(Boolean);

  if (!editing.name && !editing.images.length){
    alert('请至少填写名字或添加一张例图');
    return;
  }

  editing.updatedAt = Date.now();
  await dbPut(editing);

  const i = artists.findIndex(x => x.id === editing.id);
  if (i >= 0) artists[i] = editing; else artists.push(editing);

  closeEditor();
  render();
}

async function deleteArtist(){
  if (!confirm('确定删除这位画师吗？此操作不可撤销。')) return;
  await dbDel(editing.id);
  artists = artists.filter(x => x.id !== editing.id);
  closeEditor();
  render();
}

function closeEditor(){
  $('#modal').classList.remove('open');
  document.body.style.overflow = '';
  editing = null;
}

const modalBox = $('#modalBox');

modalBox.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'close' || act === 'cancel') closeEditor();
  else if (act === 'save') await saveEditor();
  else if (act === 'delete') await deleteArtist();
  else if (act === 'addUrl') addUrlImage();
  else if (act === 'pickFile') $('#f-file').click();
  else if (act === 'rmImg'){ editing.images.splice(+btn.dataset.i, 1); renderImgList(); }
});

modalBox.addEventListener('change', async e => {
  if (e.target.id === 'f-file'){
    await addFiles(e.target.files);
    e.target.value = '';
  }
});

modalBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-url'){
    e.preventDefault();
    addUrlImage();
  }
});

$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeEditor();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeEditor();
});

/* ===================== 导出 / 导入 ===================== */
function blobToDataURL(b){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(b);
  });
}

function dataURLtoBlob(d){
  const [head, body] = d.split(',');
  const mime = (head.match(/:(.*?);/) || [])[1] || 'image/png';
  const bin = atob(body);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}

async function exportData(){
  if (!artists.length){ alert('还没有数据可以导出'); return; }
  const btn = $('#exportBtn'), old = btn.innerHTML;
  btn.innerHTML = '导出中…'; btn.disabled = true;
  try{
    const out = [];
    for (const a of artists){
      const images = [];
      for (const img of a.images){
        if (img.kind === 'url'){
          images.push({ id: img.id, kind: 'url', src: img.src });
        } else {
          images.push({ id: img.id, kind: 'file', name: img.name || '',
                        dataUrl: await blobToDataURL(img.blob) });
        }
      }
      out.push({
        id: a.id, name: a.name, note: a.note, tags: a.tags,
        createdAt: a.createdAt, updatedAt: a.updatedAt, images
      });
    }
    const blob = new Blob(
      [JSON.stringify({ version: 1, exportedAt: Date.now(), artists: out })],
      { type: 'application/json' }
    );
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `画师收藏备份-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(err){
    console.error(err);
    alert('导出失败：' + err.message);
  } finally {
    btn.innerHTML = old; btn.disabled = false;
  }
}

async function importData(file){
  let data;
  try{
    data = JSON.parse(await file.text());
  } catch(e){
    alert('不是有效的 JSON 文件'); return;
  }
  const list = Array.isArray(data) ? data : (data.artists || []);
  if (!Array.isArray(list) || !list.length){ alert('文件里没有画师数据'); return; }

  let count = 0;
  for (const raw of list){
    const a = {
      id: raw.id || uid(),
      name: raw.name || '',
      note: raw.note || '',
      tags: Array.isArray(raw.tags) ? raw.tags : [],
      createdAt: raw.createdAt || Date.now(),
      updatedAt: raw.updatedAt || Date.now(),
      images: []
    };
    for (const img of (raw.images || [])){
      if (img.kind === 'url' && img.src){
        a.images.push({ id: img.id || uid(), kind: 'url', src: img.src });
      } else if (img.dataUrl){
        try{
          a.images.push({
            id: img.id || uid(), kind: 'file',
            blob: dataURLtoBlob(img.dataUrl), name: img.name || ''
          });
        } catch(e){}
      }
    }
    await dbPut(a);
    const i = artists.findIndex(x => x.id === a.id);
    if (i >= 0) artists[i] = a; else artists.push(a);
    count++;
  }
  render();
  alert(`已导入 / 更新 ${count} 位画师`);
}

/* ===================== 顶栏事件 ===================== */
$('#addBtn').onclick = () => openEditor(null);
$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) await importData(f);
};
$('#search').addEventListener('input', e => {
  query = e.target.value.trim();
  render();
});

/* ===================== 启动 ===================== */
(async function init(){
  try{
    db = await openDB();
    artists = await dbAll();
    render();
  } catch(err){
    console.error(err);
    document.body.innerHTML =
      '<p style="padding:24px;color:#ff6b6b">无法打开本地数据库：' +
      esc(err.message) + '<br>请尝试关闭无痕模式，或换用 Chrome / Edge / Safari 打开。</p>';
  }
})();
</script>
